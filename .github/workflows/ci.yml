name: CI

on:
  push:
  pull_request:

jobs:
  legacy-python:
    name: 旧原型回归
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 安装旧原型
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: 代码检查
        run: ruff check src tests app.py pages
      - name: 单元测试
        run: pytest --cov=fundlab --cov-report=term-missing

  mvp-backend:
    name: MVP 后端
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: 安装后端
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: 代码检查
        working-directory: backend
        run: ruff check .
      - name: 测试与迁移
        working-directory: backend
        run: |
          pytest --cov=app --cov-report=term-missing
          FUNDLAB_V1_DATABASE_URL=sqlite:////tmp/fundlab_migration.sqlite3 alembic upgrade head
          FUNDLAB_V1_DATABASE_URL=sqlite:////tmp/fundlab_migration.sqlite3 alembic downgrade base

  mvp-frontend:
    name: MVP 前端
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装
        working-directory: frontend
        run: npm ci
      - name: 组件测试与构建
        working-directory: frontend
        run: |
          npm test
          npm run build
      - name: 浏览器测试
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          npm run e2e
