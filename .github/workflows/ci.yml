name: CI

on:
  push:
  pull_request:

jobs:
  windows-powershell:
    name: Windows PowerShell 脚本兼容性
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: PowerShell 5.1 语法检查
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem scripts -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Error "$($_.Name): $($errors -join '; ')"
            }
          }
          if ($failed) { exit 1 }

  v2-backend:
    name: v2.1 后端
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: 安装后端
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: 代码检查
        working-directory: backend
        run: ruff check .
      - name: 测试与迁移
        working-directory: backend
        run: |
          pytest --cov=app --cov-report=term-missing
          FUNDLAB_DATABASE_URL=sqlite:////tmp/fundlab_v2_migration.sqlite3 alembic upgrade head
          FUNDLAB_DATABASE_URL=sqlite:////tmp/fundlab_v2_migration.sqlite3 alembic downgrade base

  v2-frontend:
    name: v2.1 前端
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装
        working-directory: frontend
        run: npm ci
      - name: 组件测试与构建
        working-directory: frontend
        run: |
          npm test
          npm run build
      - name: 浏览器测试
        working-directory: frontend
        run: |
          npx playwright install-deps chromium
          npm run e2e:install
          npm run e2e
