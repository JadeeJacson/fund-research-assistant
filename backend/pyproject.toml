[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fundlab-decision-console"
version = "2.1.0"
description = "基金仓位决策台 v2.1 本地 API"
requires-python = ">=3.12,<3.14"
dependencies = [
    "alembic>=1.14,<2",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "pillow>=10.4,<13",
    "pydantic>=2.10,<3",
    "python-multipart>=0.0.20,<1",
    "python-dotenv>=1,<2",
    "pyyaml>=6,<7",
    "sqlalchemy>=2.0,<3",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
market = ["akshare>=1.18.64,<2"]
ocr = [
    "onnxruntime>=1.20,<2",
    "opencv-python-headless>=4.10,<5",
    "rapidocr>=3.4,<4",
]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-q --basetemp=.pytest-tmp"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008"]
