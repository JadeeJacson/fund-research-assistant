[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fund-research-assistant"
version = "0.1.0"
description = "面向中国公募基金的本地研究、组合风控与 DeepSeek 证据分析工具"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = {text = "MIT"}
authors = [{name = "JadeeJacson"}]
dependencies = [
    "akshare>=1.18.64,<2",
    "numpy>=1.26,<3",
    "openpyxl>=3.1,<4",
    "pandas>=2.2,<4",
    "plotly>=5.24,<7",
    "pydantic>=2.10,<3",
    "python-dotenv>=1,<2",
    "quantstats>=0.0.81,<0.1",
    "scipy>=1.11,<2",
    "streamlit>=1.40,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.8,<1",
]

[project.scripts]
fundlab = "fundlab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]
